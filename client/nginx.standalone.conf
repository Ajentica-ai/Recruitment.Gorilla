# Recruitment Gorilla - standalone Docker web gateway
#
# Browser
#   |
#   +-- /              -> React/Vite SPA
#   +-- /api/          -> ASP.NET Core API
#   +-- /hubs/         -> ASP.NET Core SignalR
#
# The Docker Compose service is named "api" and listens on port 8081.

upstream rg_api {
    server api:8081;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------
    # Uploads
    # ------------------------------------------------------------
    # CV uploads can be large and may contain multiple files.
    # Keep this at or above the API's own request-size limit.
    client_max_body_size 64m;

    # ------------------------------------------------------------
    # API timeouts
    # ------------------------------------------------------------
    # CV parsing is synchronous during upload, so allow enough time
    # for the API to complete the request.
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ------------------------------------------------------------
    # ASP.NET Core API
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass http://rg_api;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve the original request information.
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;

        # Do not buffer large API request/response bodies unnecessarily.
        proxy_request_buffering on;
    }

    # ------------------------------------------------------------
    # SignalR / WebSocket
    # ------------------------------------------------------------
    location /hubs/ {
        proxy_pass http://rg_api;

        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;

        # Send upload/progress events immediately.
        proxy_buffering off;

        # SignalR connections can remain open for a long time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------
    # Vite static assets
    # ------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }

    # ------------------------------------------------------------
    # index.html
    # ------------------------------------------------------------
    # Never cache the SPA entry point. Otherwise, after deployment,
    # browsers may continue loading an old JS bundle whose fingerprinted
    # assets no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        try_files $uri =404;
    }

    # ------------------------------------------------------------
    # React/Vite SPA
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
