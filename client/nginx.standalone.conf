# The whole app behind one origin, for `docker compose up`.
#
# This is the standalone counterpart to nginx.spa.conf. That one assumes a
# platform gateway in front, terminating /ats and proxying /api itself; here
# there is no gateway, so this container IS the origin and has to route the
# API and the hub as well as serve the bundle.
#
# One origin is not a convenience — it is what the app is built for. The client
# calls `/api` and `/hubs/cv-upload` as same-origin paths, and the refresh
# token is a SameSite=Strict cookie. Serving the bundle from a different host
# or port than the API would drop that cookie and silently end every session
# when the access token expires.

upstream rg_api {
    # The Compose service name. Docker's embedded DNS resolves it on the
    # project network; the API publishes no ports, so this is the only way in.
    server api:8081;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CVs are uploaded here, and the default of 1m rejects a batch of them.
    # Keep this at or above the API's own limit.
    client_max_body_size 64m;

    # Long enough for a bulk CV parse to finish rather than being cut off
    # mid-request; the parsing is synchronous on the upload call.
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location /api/ {
        proxy_pass http://rg_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR. The Upgrade/Connection pair is what makes it a WebSocket rather
    # than falling back to long-polling, and buffering off is what makes the
    # per-file upload progress arrive as it happens instead of in one lump.
    location /hubs/ {
        proxy_pass http://rg_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Vite fingerprints these, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a browser keeps loading the old
    # bundle's asset names after a deploy and the app fails on 404s.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
