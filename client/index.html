<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recruitment Gorilla</title>
    <script>
      // Set the theme before paint to avoid a flash. Mirrored by
      // src/theme/ThemeContext.tsx — the stored value is the *preference*
      // ('light' | 'dark' | 'system'), so 'system' and "nothing saved" both
      // resolve against the OS here. Writing the raw stored value would set
      // data-bs-theme="system", which matches no stylesheet and paints light.
      (function () {
        try {
          var saved = localStorage.getItem('rg-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-bs-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
